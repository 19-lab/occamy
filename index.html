<style>
:root{color-scheme:dark;--tx:#e6f6ff;--mu:#7f9bb0;--ac:#5ee6ff;--pn:#0a111d;--bd:#1f3a52;box-sizing:border-box}
*{box-sizing:border-box}
html,body{height:100%;margin:0;background:#02040a;color:var(--tx);font:15px/1.4 "Trebuchet MS",system-ui,sans-serif;overflow:hidden;-webkit-tap-highlight-color:transparent}
#bg{position:fixed;inset:0;width:100%;height:100%;touch-action:none}
#ck{position:fixed;z-index:2;pointer-events:none;max-width:none;}
.scr{position:fixed;z-index:3;background:rgba(2,12,22,.74);color:#9eeaff;line-height:1.25;padding:4px 6px;overflow:hidden;border-radius:8px;box-shadow:inset 0 0 12px rgba(0,200,255,.3)}
.scr b{display:block;color:#fff;letter-spacing:.04em}
#sc{padding:0}
#rd{position:absolute;inset:0;width:100%;height:100%}
#imp{position:absolute;right:4px;bottom:3px;display:flex;align-items:center;gap:4px;color:#9eeaff}
#imp button{padding:0 9px;margin:0;font-size:15px;border-radius:7px;line-height:1.3}
#hint{position:fixed;z-index:3;left:0;right:0;text-align:center;color:#bff3ff;font-size:12px;text-shadow:0 0 8px #000;pointer-events:none;transition:opacity .8s}
#cn{position:fixed;left:0;right:0;bottom:0;max-width:440px;margin:0 auto;z-index:4;display:flex;justify-content:space-around;padding:26px 10px calc(8px + env(safe-area-inset-bottom,0px));background:linear-gradient(transparent,rgba(2,4,8,.88) 60%)}
#cn button{width:46px;height:46px;border-radius:50%;padding:0;margin:0;font-size:19px;background:#0b1624;border:2px solid var(--c,#1c6f86);box-shadow:0 0 12px var(--c,#1c6f86),inset 0 0 8px rgba(0,0,0,.8);display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1}
#cn small{font-size:8px;color:var(--mu);margin-top:1px}
#sh{position:fixed;left:0;right:0;bottom:0;z-index:6;max-height:72%;overflow:auto;background:var(--pn);border-top:1px solid var(--ac);border-radius:22px 22px 0 0;padding:18px 18px calc(24px + env(safe-area-inset-bottom,0px));transform:translateY(105%);transition:transform .35s ease;box-shadow:0 -4px 30px rgba(94,230,255,.25)}
#sh.open{transform:none}
h2{margin:0 0 8px;font-size:19px}h3{margin:18px 0 6px;font-size:15px;color:var(--ac)}
input,select,textarea{width:100%;background:#050b14;color:var(--tx);border:1px solid var(--bd);border-radius:10px;padding:10px;font:inherit;margin:5px 0}
input[type=range]{padding:0;accent-color:var(--ac)}
button{background:#0f2133;color:var(--tx);border:1px solid var(--bd);border-radius:10px;padding:10px 14px;font:inherit;margin:4px 6px 4px 0;cursor:pointer}
.pri{background:var(--ac);color:#00232b;border:0;font-weight:700}
.g{background:none;border:0;color:var(--mu)}
.x{float:right;margin:0}
.row{display:flex;gap:8px;align-items:center}.row>*{flex:1}.row>button{flex:0 0 auto}
.mi{display:flex;align-items:center;gap:8px;padding:6px 0;border-bottom:1px solid #12293d}
.mi span{flex:1}.mi input{width:auto;margin:0}.mi button{margin:0;padding:6px 10px}
.dn{text-decoration:line-through;color:var(--mu)}
.lg{padding:6px 10px;border-left:2px solid var(--bd);margin:8px 0;color:var(--mu)}
.lg.last{border-color:var(--ac);color:var(--tx)}
.big{padding:14px;border:1px solid var(--ac);border-radius:12px;margin:10px 0;font-size:17px}
.so{display:block;padding:10px 4px;border-bottom:1px solid #12293d;color:var(--tx);text-decoration:none}
.m{color:var(--mu)}label{color:var(--mu);font-size:13px}
#fl{position:fixed;left:0;right:0;bottom:0;z-index:1;background:linear-gradient(#0b101c,#04060b)}
#post{position:fixed;inset:0;z-index:5;pointer-events:none;background:radial-gradient(ellipse at 50% 38%,transparent 52%,rgba(0,0,10,.55) 100%)}

const AU=(()=>{let c=null,m=null,hg=null,lvl=1;try{const v=localStorage.getItem('occamy_snd');if(v!==null)lvl=+v}catch(e){}
const G=[0,.5,.22];
function init(){if(c){if(c.state==='suspended')c.resume();return}
const AC=window.AudioContext||window.webkitAudioContext;if(!AC)return;try{c=new AC()}catch(e){return}
m=c.createGain();m.gain.value=G[lvl];m.connect(c.destination);
hg=c.createGain();hg.gain.value=0;
const lp=c.createBiquadFilter();lp.type='lowpass';lp.frequency.value=380;lp.Q.value=.4;
[[110,'sine',.5],[165,'sine',.26],[82.5,'triangle',.34]].forEach(([f,ty,g])=>{const o=c.createOscillator(),og=c.createGain();o.type=ty;o.frequency.value=f;og.gain.value=g;o.connect(og);og.connect(lp);o.start()});
const nb=c.createBuffer(1,c.sampleRate*2,c.sampleRate),d=nb.getChannelData(0);let l=0;for(let i=0;i<d.length;i++){l=l*.97+(Math.random()*2-1)*.03;d[i]=l*6}
const ns=c.createBufferSource();ns.buffer=nb;ns.loop=true;const ng=c.createGain();ng.gain.value=.3;ns.connect(ng);ng.connect(lp);ns.start();
const lf=c.createOscillator(),lg=c.createGain();lf.frequency.value=.12;lg.gain.value=60;lf.connect(lg);lg.connect(lp.frequency);lf.start();
lp.connect(hg);hg.connect(m)}
function tone(f,t0,dur,vol,f2){const o=c.createOscillator(),g=c.createGain();o.type='sine';o.frequency.setValueAtTime(f,t0);if(f2)o.frequency.exponentialRampToValueAtTime(f2,t0+dur);g.gain.setValueAtTime(.0001,t0);g.gain.linearRampToValueAtTime(vol,t0+.06);g.gain.exponentialRampToValueAtTime(.0001,t0+dur);o.connect(g);g.connect(m);o.start(t0);o.stop(t0+dur+.05)}
function sfx(n){if(!c||!lvl||c.state!=='running')return;const t=c.currentTime+.02;
if(n==='go'){tone(130,t,1.1,.05,190)}
else if(n==='arrive'){tone(220,t,1.3,.06,110);tone(147,t+.15,1.4,.04)}
else if(n==='done'){tone(523.25,t,1.1,.045);tone(659.25,t+.1,1.3,.04)}
else if(n==='land'){[261.63,329.63,392,523.25].forEach((f,i)=>tone(f,t+i*.2,1.8,.045))}}
function hum(v){if(!c||!hg)return;hg.gain.setTargetAtTime(lvl?v*.16:0,c.currentTime,.35)}
function cycle(){lvl=lvl==1?2:lvl==2?0:1;try{localStorage.setItem('occamy_snd',lvl)}catch(e){}if(m)m.gain.setTargetAtTime(G[lvl],c.currentTime,.05);if(!lvl)hum(0);return lvl}
